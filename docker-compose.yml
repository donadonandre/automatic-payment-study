services:
  postgres:
    image: postgres:17-alpine
    container_name: simplepix-postgres
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_wal_senders=4",
        "-c",
        "max_replication_slots=4",
      ]
    environment:
      POSTGRES_USER: pix
      POSTGRES_PASSWORD: pix
      POSTGRES_DB: pix_payments
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix -d pix_payments"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: simplepix-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: pix
      MONGO_INITDB_ROOT_PASSWORD: pix
      MONGO_INITDB_DATABASE: pix_statements
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    image: apache/kafka:3.9.0
    container_name: simplepix-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: simplepix-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: simplepix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: simplepix-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

  kafka-connect:
      build:
        context: ./kafka-connect
      container_name: simplepix-kafka-connect
      depends_on:
        kafka:
          condition: service_started
        postgres:
          condition: service_healthy
        mongodb:
          condition: service_started
      ports:
        - "8083:8083"
      environment:
        BOOTSTRAP_SERVERS: kafka:29092
        GROUP_ID: simplepix-connect-cluster
        CONFIG_STORAGE_TOPIC: _connect-configs
        OFFSET_STORAGE_TOPIC: _connect-offsets
        STATUS_STORAGE_TOPIC: _connect-status
        KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
        VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
        CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
        CONNECT_REST_PORT: "8083"
        CONNECT_PLUGIN_PATH: /kafka/connect

volumes:
  pg_data:
  mongo_data:
