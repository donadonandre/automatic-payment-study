spring:
    application:
        name: pix-payment-service

    threads:
        virtual:
            enabled: true

    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/pix_payments
        username: ${DB_USER:pix}
        password: ${DB_PASSWORD:pix}
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
                jdbc:
                    batch_size: 20

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all
            properties:
                enable.idempotence: true
                max.in.flight.requests.per.connection: 5

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: always
    health:
        kafka:
            enabled: true

server:
    port: 8081

logging:
    level:
        io.simplepix: DEBUG
        org.hibernate.SQL: DEBUG

---
spring:
    config:
        activate:
            on-profile: local